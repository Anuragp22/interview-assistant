# CI for JobVoice / Interview Assistant.
#
# This file makes the resume claims literally true:
#   - "tests run in CI"        -> web-checks + agent-checks (always run, no keys)
#   - "eval harness runs weekly/dispatch against committed baselines"
#                              -> eval-gate (10pp regression vs eval/baselines.json)
#   - "the judge's scores are measured, not asserted"
#                              -> judge-eval (4 golden transcripts x 3 runs through
#                                 the real judge: score bands + run-to-run stability,
#                                 vs the bands committed in eval/judge/fixtures.ts)
#   - "54-case prompt-injection audit"
#                              -> security-audit (54 cases, one call each, at grill
#                                 intensity, vs security_baseline.json's 52 passing)
#
# The LLM-backed gates need provider keys as repo secrets (Settings -> Secrets
# and variables -> Actions). eval-gate + security-audit need Groq: up to three
# separate Groq accounts for failover, plus an optional legacy single key.
# judge-eval needs GEMINI_API_KEY, because the judge is a different model family
# from the interviewer. The exact secret names are in the env blocks on each gate
# job below. Without them those jobs SKIP cleanly. The expectations they measure
# against are all committed: eval/baselines.json, security_baseline.json, and
# eval/judge/fixtures.ts.
#
# The three LLM gates are NONDETERMINISTIC, so they run ONLY on the weekly
# schedule + manual dispatch, not on every push/PR. That keeps the trunk from
# flaky-redding on LLM output variance and avoids spending provider tokens on
# every commit. The deterministic gates (web-checks, agent-checks) block every
# push/PR. Run the LLM gates on demand with: gh workflow run CI

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC (LLM gates only)

jobs:
  web-checks:
    name: Web - typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm install` (not `npm ci`): the committed package-lock.json is
      # missing some platform-specific optional deps (Tailwind 4's native
      # @tailwindcss/oxide / @emnapi bindings for linux), so `npm ci`'s
      # strict lock check fails on the CI runner. Follow-up: regenerate the
      # lockfile on linux and switch back to `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test

  agent-checks:
    name: Agent - pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livekit-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Unit tests (pytest)
        run: uv run pytest -q

  eval-gate:
    name: Question-gen drift gate
    runs-on: ubuntu-latest
    needs: web-checks
    # Nondeterministic LLM gate: schedule + manual only, never blocks push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm install` (not `npm ci`): the committed package-lock.json is
      # missing some platform-specific optional deps (Tailwind 4's native
      # @tailwindcss/oxide / @emnapi bindings for linux), so `npm ci`'s
      # strict lock check fails on the CI runner. Follow-up: regenerate the
      # lockfile on linux and switch back to `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Eval (fails on >10pp drop vs eval/baselines.json)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GROQ_API_KEY1" ] && [ -z "$GROQ_API_KEY2" ] && [ -z "$GROQ_API_KEY3" ]; then
            echo "::warning::GROQ_API_KEY not set - skipping question-gen drift gate."
            exit 0
          fi
          npm run eval

  judge-eval:
    name: Judge-quality gate
    runs-on: ubuntu-latest
    needs: web-checks
    # Nondeterministic LLM gate: schedule + manual only, never blocks push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A clean run is 3-7 min (48 sequential Gemini calls), and a handful of them
    # normally hit a rate limit and eat the harness's internal 60s retry. Even
    # the pathological case — all 12 judgeInterview() calls retrying once — lands
    # around 20 min, so 25 leaves headroom without inheriting the 6-hour default:
    # a wedged provider call should cost one runner-hour, not six, and the weekly
    # failure signal should arrive the same morning it fires.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm install` (not `npm ci`): the committed package-lock.json is
      # missing some platform-specific optional deps (Tailwind 4's native
      # @tailwindcss/oxide / @emnapi bindings for linux), so `npm ci`'s
      # strict lock check fails on the CI runner. Follow-up: regenerate the
      # lockfile on linux and switch back to `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Judge eval (golden transcripts, accuracy + stability)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set - skipping judge-quality gate."
            exit 0
          fi
          npm run eval:judge

  security-audit:
    name: Prompt-injection audit gate
    runs-on: ubuntu-latest
    needs: agent-checks
    # Nondeterministic LLM gate: schedule + manual only, never blocks push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: livekit-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Injection audit (fails on regression vs committed baseline)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GROQ_API_KEY1" ] && [ -z "$GROQ_API_KEY2" ] && [ -z "$GROQ_API_KEY3" ]; then
            echo "::warning::GROQ_API_KEY not set - skipping prompt-injection audit gate."
            exit 0
          fi
          uv run python -m interview_agent.security.run_audit

# Note: eval-gate + judge-eval + security-audit are gated to schedule/dispatch
# via the `if:` on each job, so push/PR runs only the fast, deterministic gates.
