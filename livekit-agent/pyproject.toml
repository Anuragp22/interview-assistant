[project]
name = "interview-agent"
version = "0.1.0"
description = "LiveKit Agents worker for the Interview Assistant voice interviewer."
requires-python = ">=3.11"
dependencies = [
  # >=1.6.1 for livekit.agents.inference.TurnDetector — the audio end-of-turn
  # model. It ships inside livekit-agents itself; the separate
  # livekit-plugins-turn-detector package is deprecated and slated for removal,
  # so do NOT add it back.
  "livekit-agents>=1.6.1,<2",
  "livekit-plugins-deepgram>=1.6.1,<2",
  "livekit-plugins-openai>=1.6.1,<2",
  "livekit-plugins-elevenlabs>=1.6.1,<2",
  "livekit-plugins-silero>=1.6.1,<2",
  "firebase-admin>=6.5",
  "python-dotenv>=1.0",
  # OpenTelemetry — share the trace started by the Next.js server action.
  # opentelemetry-exporter-otlp-proto-http rides over plain HTTPS, no
  # collector or gRPC dependency.
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
